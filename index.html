<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - Attendance App</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Supabase JS Client v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #0066FF;
      --primary-hover: #0052CC;
      --primary-active: #003D99;
      --primary-light: #EFF6FF;
      --bg-gradient: linear-gradient(135deg, #F8FAFC 0%, #E2E8F0 100%);
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border-color: #CBD5E1;
      --error-bg: #FEF2F2;
      --error-border: #FCA5A5;
      --error-text: #991B1B;
      --success-bg: #F0FDF4;
      --success-border: #86EFAC;
      --success-text: #166534;
      --shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      --radius-card: 24px;
      --radius-btn: 14px;
      --radius-icon: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 440px;
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      padding: 40px 32px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.8);
      position: relative;
      overflow: hidden;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--primary);
      background: var(--primary-light);
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 24px;
    }

    .icon-wrapper {
      width: 72px;
      height: 72px;
      border-radius: var(--radius-icon);
      background: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      color: var(--primary);
      box-shadow: 0 8px 16px -4px rgba(0, 102, 255, 0.15);
    }

    .icon-wrapper svg {
      width: 36px;
      height: 36px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
      letter-spacing: -0.4px;
    }

    p.description {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-control {
      width: 100%;
      height: 48px;
      padding: 0 44px 0 16px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text-main);
      background-color: #F8FAFC;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-control:focus {
      background-color: #FFFFFF;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(0, 102, 255, 0.1);
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #94A3B8;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }

    .toggle-password:hover {
      color: var(--text-main);
    }

    .toggle-password svg {
      width: 20px;
      height: 20px;
    }

    .validation-msg {
      font-size: 12.5px;
      min-height: 20px;
      margin-bottom: 20px;
      text-align: left;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .validation-msg.error {
      color: var(--error-text);
    }

    .validation-msg.success {
      color: var(--success-text);
    }

    .btn-primary {
      width: 100%;
      height: 52px;
      background-color: var(--primary);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-btn);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 10px 15px -3px rgba(0, 102, 255, 0.3);
      -webkit-tap-highlight-color: transparent;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
      box-shadow: 0 12px 20px -3px rgba(0, 102, 255, 0.4);
    }

    .btn-primary:active:not(:disabled) {
      background-color: var(--primary-active);
      transform: scale(0.98);
    }

    .btn-primary:disabled {
      background-color: #CBD5E1;
      color: #64748B;
      cursor: not-allowed;
      box-shadow: none;
      opacity: 0.7;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #FFFFFF;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .helper-text {
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .helper-text a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .alert-card {
      display: none;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: left;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .alert-card.error {
      display: block;
      background-color: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }

    .alert-card.success {
      display: block;
      background-color: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }

    .footer-note {
      margin-top: 28px;
      font-size: 12px;
      color: #94A3B8;
      border-top: 1px solid #F1F5F9;
      padding-top: 16px;
    }
  </style>
</head>

<body>

  <main class="container" role="main">
    <div class="brand">
      <span>Attendance App</span>
    </div>

    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>

    <!-- Alert Message Container -->
    <div class="alert-card" id="alertCard" role="alert"></div>

    <div id="contentSection">
      <h1>Reset Password</h1>
      <p class="description">
        Enter your new password below. When both passwords match, click <strong>Open Attendance App</strong> to update
        your password and launch the app.
      </p>

      <form id="resetForm" onsubmit="return false;">
        <!-- New Password Field -->
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <div class="input-wrapper">
            <input type="password" id="newPassword" class="form-control" placeholder="At least 6 characters"
              autocomplete="new-password" required />
            <button type="button" class="toggle-password" id="toggleNewPassword"
              aria-label="Toggle password visibility">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-wrapper">
            <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter new password"
              autocomplete="new-password" required />
            <button type="button" class="toggle-password" id="toggleConfirmPassword"
              aria-label="Toggle confirm password visibility">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Live Validation Helper -->
        <div class="validation-msg" id="validationMsg"></div>

        <!-- Primary Action Button (DISABLED initially until passwords match) -->
        <button class="btn-primary" id="openAppBtn" type="button" disabled aria-label="Open Attendance App">
          <span id="btnText">Open Attendance App</span>
          <span id="btnSpinner" class="spinner" style="display: none;" aria-hidden="true"></span>
        </button>
      </form>

      <p class="helper-text" id="helperText" style="display: none;">
        Didn't redirect automatically? <a href="#" id="retryLink">Click here to launch app</a>.
      </p>
    </div>

    <footer class="footer-note">
      Attendance App Password Security • Deep-Link Recovery
    </footer>
  </main>

  <script>
    // PRESERVE RAW URL PARAMETERS IMMEDIATELY BEFORE ANY BROWSER ROUTING OR CLEARS
    const INITIAL_HASH = window.location.hash || '';
    const INITIAL_SEARCH = window.location.search || '';

    (function () {
      'use strict';

      // Supabase Credentials
      const SUPABASE_URL = 'https://vvqmhbynwhllzvonsgzz.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_8hO469_QiCAWu6uZv2bcVA_p25SbWYT';

      // Deep Link Constants
      const SCHEME = 'com.example.flutter_application_1';
      const HOST = 'reset-password';
      const PACKAGE = 'com.example.flutter_application_1';
      const FLUTTER_DEEP_LINK = SCHEME + '://' + HOST;
      const ANDROID_INTENT_LINK = 'intent://' + HOST + '#Intent;scheme=' + SCHEME + ';package=' + PACKAGE + ';end;';

      // DOM Elements
      const newPasswordInput = document.getElementById('newPassword');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const toggleNewPasswordBtn = document.getElementById('toggleNewPassword');
      const toggleConfirmPasswordBtn = document.getElementById('toggleConfirmPassword');
      const validationMsg = document.getElementById('validationMsg');
      const openAppBtn = document.getElementById('openAppBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const alertCard = document.getElementById('alertCard');
      const helperText = document.getElementById('helperText');
      const retryLink = document.getElementById('retryLink');

      let supabaseClient = null;
      let sessionEstablished = false;

      // Create Supabase JS Client with auto-session detection enabled
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
          auth: {
            detectSessionInUrl: true,
            persistSession: true,
            autoRefreshToken: true
          }
        });
      }

      console.log('RECOVERY PAGE INITIALIZED');

      function showAlert(message, isSuccess = false) {
        alertCard.style.display = 'block';
        alertCard.className = isSuccess ? 'alert-card success' : 'alert-card error';
        alertCard.innerHTML = message;
      }

      function hideAlert() {
        alertCard.style.display = 'none';
        alertCard.textContent = '';
      }

      /**
       * ESTABLISH RECOVERY SESSION FROM ALL POSSIBLE SUPABASE PARAMETERS
       */
      async function establishSession() {
        if (!supabaseClient) return false;

        try {
          // 1. Check existing session
          const { data: { session } } = await supabaseClient.auth.getSession();
          if (session) {
            console.log('ACTIVE SESSION FOUND:', session.user.email);
            sessionEstablished = true;
            return true;
          }

          // 2. Parse URL hash & query strings
          const hashStr = INITIAL_HASH || window.location.hash || '';
          const searchStr = INITIAL_SEARCH || window.location.search || '';

          const hashParams = new URLSearchParams(hashStr.replace(/^#/, ''));
          const searchParams = new URLSearchParams(searchStr);

          const accessToken = hashParams.get('access_token') || searchParams.get('access_token');
          const refreshToken = hashParams.get('refresh_token') || searchParams.get('refresh_token');
          const tokenHash = searchParams.get('token_hash') || searchParams.get('token') || hashParams.get('token_hash');
          const code = searchParams.get('code') || hashParams.get('code');
          const type = searchParams.get('type') || hashParams.get('type') || 'recovery';

          // A. Hash Token SetSession
          if (accessToken && refreshToken) {
            console.log('ESTABLISHING SESSION VIA ACCESS_TOKEN & REFRESH_TOKEN...');
            const { data, error } = await supabaseClient.auth.setSession({
              access_token: accessToken,
              refresh_token: refreshToken
            });
            if (!error && data?.session) {
              sessionEstablished = true;
              console.log('SESSION ESTABLISHED VIA SETSESSION');
              return true;
            }
          }

          // B. Verify OTP Token Hash
          if (tokenHash) {
            console.log('ESTABLISHING SESSION VIA TOKEN_HASH...');
            const { data, error } = await supabaseClient.auth.verifyOtp({
              token_hash: tokenHash,
              type: type
            });
            if (!error && data?.session) {
              sessionEstablished = true;
              console.log('SESSION ESTABLISHED VIA VERIFYOTP');
              return true;
            }
          }

          // C. Exchange Code for Session (PKCE)
          if (code) {
            console.log('ESTABLISHING SESSION VIA CODE...');
            const { data, error } = await supabaseClient.auth.exchangeCodeForSession(code);
            if (!error && data?.session) {
              sessionEstablished = true;
              console.log('SESSION ESTABLISHED VIA EXCHANGECODE');
              return true;
            }
          }

        } catch (e) {
          console.error('Session establishment error:', e);
        }

        return false;
      }

      // Listen for auth state changes
      if (supabaseClient) {
        supabaseClient.auth.onAuthStateChange((event, session) => {
          console.log('AUTH EVENT:', event, session ? session.user.email : 'NO SESSION');
          if (session) {
            sessionEstablished = true;
          }
        });
      }

      // Execute on page load
      document.addEventListener('DOMContentLoaded', async () => {
        const success = await establishSession();
        if (!success && !sessionEstablished) {
          console.warn('NO RECOVERY SESSION FOUND ON PAGE LOAD');
        }
      });

      /**
       * Password Input Visibility Toggles
       */
      function setupPasswordToggle(inputEl, buttonEl) {
        buttonEl.addEventListener('click', function () {
          const type = inputEl.getAttribute('type') === 'password' ? 'text' : 'password';
          inputEl.setAttribute('type', type);
        });
      }

      setupPasswordToggle(newPasswordInput, toggleNewPasswordBtn);
      setupPasswordToggle(confirmPasswordInput, toggleConfirmPasswordBtn);

      /**
       * Real-Time Form Validation
       */
      function validateForm() {
        const password = newPasswordInput.value;
        const confirm = confirmPasswordInput.value;

        if (!password && !confirm) {
          validationMsg.textContent = '';
          validationMsg.className = 'validation-msg';
          openAppBtn.disabled = true;
          return false;
        }

        if (password.length < 6) {
          validationMsg.textContent = 'Password must be at least 6 characters long.';
          validationMsg.className = 'validation-msg error';
          openAppBtn.disabled = true;
          return false;
        }

        if (password !== confirm) {
          validationMsg.textContent = 'Passwords do not match.';
          validationMsg.className = 'validation-msg error';
          openAppBtn.disabled = true;
          return false;
        }

        validationMsg.textContent = '✓ Passwords match! Ready to update.';
        validationMsg.className = 'validation-msg success';
        openAppBtn.disabled = false;
        return true;
      }

      newPasswordInput.addEventListener('input', validateForm);
      confirmPasswordInput.addEventListener('input', validateForm);

      /**
       * Launch Attendance App Deep Link
       */
      function triggerAppLaunch() {
        helperText.style.display = 'block';
        const isAndroid = /Android/i.test(navigator.userAgent);

        if (isAndroid) {
          const link = document.createElement('a');
          link.href = ANDROID_INTENT_LINK;
          link.rel = 'noreferrer';
          document.body.appendChild(link);
          link.click();

          setTimeout(function () {
            window.location.href = ANDROID_INTENT_LINK;
          }, 300);

          setTimeout(function () {
            window.location.href = FLUTTER_DEEP_LINK;
          }, 800);
        } else {
          window.location.href = FLUTTER_DEEP_LINK;
        }
      }

      /**
       * Handle Password Update in Supabase & Redirect to Flutter App
       */
      async function handlePasswordUpdate() {
        if (!validateForm()) return;

        const newPassword = newPasswordInput.value;

        // UI Loading State
        openAppBtn.disabled = true;
        btnText.textContent = 'Updating Password...';
        btnSpinner.style.display = 'inline-block';
        hideAlert();

        try {
          if (supabaseClient) {
            // Re-verify or establish session if not already established
            let active = sessionEstablished;
            if (!active) {
              active = await establishSession();
            }

            // Attempt to update password
            const { data, error: updateError } = await supabaseClient.auth.updateUser({
              password: newPassword
            });

            if (updateError) {
              throw updateError;
            }

            console.log('PASSWORD UPDATED SUCCESSFULLY FOR USER:', data?.user?.email);
          }

          // Show Success Feedback
          showAlert('<strong>Password Updated Successfully!</strong><br/>Opening Attendance App...', true);
          btnText.textContent = 'Opening App...';

          setTimeout(function () {
            triggerAppLaunch();
          }, 1200);

        } catch (err) {
          console.error('Password Update Error:', err);
          showAlert('<strong>Update Error:</strong> ' + (err.message || 'Auth session missing. Please request a new password reset email from the app.'));
          openAppBtn.disabled = false;
          btnText.textContent = 'Open Attendance App';
          btnSpinner.style.display = 'none';
        }
      }

      openAppBtn.addEventListener('click', handlePasswordUpdate);

      retryLink.addEventListener('click', function (e) {
        e.preventDefault();
        triggerAppLaunch();
      });
    })();
  </script>
</body>

</html>
